<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ㅇㅇㅇㅇ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            margin-top: 20px;
        }
        .image-container {
            margin: 20px 0;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 300px;
            text-align: center;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>테크니션 마지막일침 핫삼</h1>
    <p>나애크로스플레임탁쳐서떨구기진흙떨구기바람일으키기가안맞았슴니다.마쳐서한방컷을내고싶어하던크로스플레임탁쳐서떨구기진흙떨구기바람일으키기가안맞앗습미다.마쳐서한방컷을내고결국에는이기고싶어하던크로스플레임탁쳐서떨구기진흙떨구기바람일으키기가안맞앗고효과가없엇스빈다.</p>
    <div class="image-container">
        <img src="https://i.namu.wiki/i/OYE_mPMWuxYUVCOeEF5PvD8TlXcZcoZi6sb_USQvn3JXbmMV4gcIy_b5JR0lOT_nT_6FE_dLf5KNANZgycmAwgrmINlsV76-QFOfvPNk0YzxKRVlMTAWB6pizHWUyWzXSyCRFQJM_THFpOHe8HhEAA.webp" alt="이미지">
    </div>

    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <p>짜잔, 사실 속으신거예요!</p>
        </div>
    </div>

    <script>
        var modal = document.getElementById("myModal");
        var span = document.getElementsByClassName("close")[0];

        window.onload = function() {
            modal.style.display = "block";
        }

        span.onclick = function() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
